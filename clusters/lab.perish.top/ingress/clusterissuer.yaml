# Let's Encrypt ClusterIssuers using DNS-01 via the imroc DNSPod webhook, mirroring
# perish-top. Credentials: Secret cert-manager/dnspod-secret (keys secretId/secretKey),
# the same Tencent DNSPod account, RE-SEALED for this cluster because sealing keys are
# cluster-specific (secrets/dnspod-sealedsecret.yaml).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    email: libertecode@proton.me
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-staging-account
    solvers:
      - dns01:
          webhook:
            groupName: acme.dnspod.com
            solverName: dnspod
            config:
              secretIdRef:
                name: dnspod-secret
                key: secretId
              secretKeyRef:
                name: dnspod-secret
                key: secretKey
              ttl: 600
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    email: libertecode@proton.me
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-prod-account
    solvers:
      - dns01:
          webhook:
            groupName: acme.dnspod.com
            solverName: dnspod
            config:
              secretIdRef:
                name: dnspod-secret
                key: secretId
              secretKeyRef:
                name: dnspod-secret
                key: secretKey
              ttl: 600
