# sealed-secrets controller via k3s helm-controller, mirroring perish-top. Lets
# encrypted SealedSecrets be committed to this repo; the controller decrypts them
# in-cluster into real Secrets. fullnameOverride aligns the controller name with
# kubeseal's default (sealed-secrets-controller). Installed into kube-system.
#
# The sealing keypair is CLUSTER-SPECIFIC (lab.perish.top): ciphertexts under this
# tree seal against THIS cluster's cert only, and perish-top's ciphertexts cannot
# be decrypted here. That is why the DNSPod credential is re-sealed rather than
# copied from clusters/perish.top/secrets/.
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: sealed-secrets
  namespace: kube-system
spec:
  # NOTE: the project moved bitnami-labs -> bitnami (2026); the old
  # bitnami-labs.github.io pages URL now 404s.
  repo: https://bitnami.github.io/sealed-secrets
  chart: sealed-secrets
  version: "2.18.6"
  targetNamespace: kube-system
  set:
    fullnameOverride: sealed-secrets-controller
