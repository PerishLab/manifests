# sealed-secrets controller via k3s helm-controller. Lets encrypted SealedSecrets be
# committed to this repo; the controller decrypts them in-cluster into real Secrets.
# fullnameOverride aligns the controller name with kubeseal's default. kube-system.
# The controller's RSA private key is this cluster's SPOF — back it up after install
# (see ./AGENTS.md). perish-top's key is independent of liberte's, so its SealedSecrets
# are re-sealed against perish-top's own pub-cert.pem.
# NOTE: the chart repo moved org bitnami-labs -> bitnami (2026-07; old GitHub Pages 404s).
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: sealed-secrets
  namespace: kube-system
spec:
  repo: https://bitnami.github.io/sealed-secrets
  chart: sealed-secrets
  version: "2.19.0"
  targetNamespace: kube-system
  set:
    fullnameOverride: sealed-secrets-controller
