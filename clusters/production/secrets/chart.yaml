apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: secrets
  namespace: secrets
spec:
  chart: oci://ghcr.io/perishlab/charts/secrets
  version: 0.7.0
  targetNamespace: secrets
  dockerRegistrySecret:
    name: registry
  helmVersion: v3
  timeout: 15m
  backOffLimit: 1
  failurePolicy: abort
  valuesContent: |-
    imagePullSecrets:
      - name: registry
    image:
      tag: 0.7.0
    storage:
      size: 1Gi
    bootstrap:
      existingSecret: secrets-bootstrap
    ingress:
      enabled: true
      className: traefik
      host: secrets.perish.cn
      annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        traefik.ingress.kubernetes.io/router.tls: "true"
        traefik.ingress.kubernetes.io/router.tls.certresolver: production
