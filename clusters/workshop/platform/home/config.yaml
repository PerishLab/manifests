apiVersion: v1
kind: ConfigMap
metadata:
  name: workshop-home
data:
  nginx.conf: |
    worker_processes 1;
    pid /tmp/nginx.pid;
    error_log /dev/stderr warn;
    events { worker_connections 128; }
    http {
        access_log /dev/stdout;
        default_type text/html;
        client_body_temp_path /tmp/client;
        proxy_temp_path /tmp/proxy;
        fastcgi_temp_path /tmp/fastcgi;
        uwsgi_temp_path /tmp/uwsgi;
        scgi_temp_path /tmp/scgi;
        server_tokens off;
        server {
            listen 8080;
            root /srv/workshop;
            add_header Cache-Control "no-store";
            location = / { try_files /index.html =404; }
            location = /index.html { }
            location / { return 404; }
        }
    }
  index.html: |
    <!doctype html>
    <html lang="zh-CN">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <meta name="color-scheme" content="light dark">
      <title>Workshop · 工作车间</title>
      <link rel="icon" href="data:,">
      <style>
        :root { color-scheme: light dark; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #202124; background: #f8f9fa; }
        * { box-sizing: border-box; }
        body { margin: 0; padding: 64px 24px; }
        main { width: 100%; max-width: 680px; margin: 0 auto; }
        header { margin-bottom: 40px; }
        .eyebrow { margin: 0 0 12px; color: #5f6368; font-size: 14px; }
        h1 { margin: 0; font-size: clamp(32px, 7vw, 44px); font-weight: 500; letter-spacing: -1.5px; }
        h2 { margin: 28px 0 12px; color: #5f6368; font-size: 13px; font-weight: 500; }
        nav { display: grid; gap: 12px; }
        a { display: flex; align-items: center; gap: 20px; padding: 22px 24px; border: 1px solid #dadce0; border-radius: 16px; background: #fff; color: inherit; text-decoration: none; transition: background .15s, border-color .15s; }
        a:hover { background: #f0f5ff; border-color: #a8c7fa; }
        a:focus-visible { outline: 3px solid #1a73e8; outline-offset: 3px; }
        .text { min-width: 0; flex: 1; }
        strong { display: block; font-size: 17px; font-weight: 500; }
        .host { display: block; margin-top: 6px; color: #5f6368; font-size: 13px; overflow-wrap: anywhere; }
        .arrow { color: #1a73e8; font-size: 22px; }
        footer { margin-top: 32px; color: #5f6368; font-size: 12px; }
        @media (max-width: 480px) { body { padding: 40px 20px; } a { padding: 20px; } }
        @media (prefers-color-scheme: dark) {
          :root { color: #e8eaed; background: #17181b; }
          .eyebrow, h2, .host, footer { color: #bdc1c6; }
          a { background: #202124; border-color: #3c4043; }
          a:hover { background: #252e3c; border-color: #8ab4f8; }
          .arrow { color: #8ab4f8; }
        }
        @media (prefers-reduced-motion: reduce) { a { transition: none; } }
      </style>
    </head>
    <body>
      <main>
        <header><p class="eyebrow">PerishLab / 工作车间</p><h1>Workshop</h1></header>
        <section aria-labelledby="production">
          <h2 id="production">生产环境</h2>
          <nav aria-label="生产环境">
            <a href="https://ensign.workshop.liberte.host/">
              <span class="text"><strong>Ensign · 身份入口</strong><span class="host">ensign.workshop.liberte.host</span></span><span class="arrow" aria-hidden="true">↗</span>
            </a>
          </nav>
        </section>
        <section aria-labelledby="development">
          <h2 id="development">开发环境 · dev</h2>
          <nav aria-label="开发环境">
            <a href="https://design.dev.workshop.liberte.host/proof/?google=1">
              <span class="text"><strong>Design · 主题预览</strong><span class="host">design.dev.workshop.liberte.host</span></span><span class="arrow" aria-hidden="true">↗</span>
            </a>
            <a href="https://ensign.dev.workshop.liberte.host/login">
              <span class="text"><strong>Ensign · 开发入口</strong><span class="host">ensign.dev.workshop.liberte.host</span></span><span class="arrow" aria-hidden="true">↗</span>
            </a>
          </nav>
        </section>
        <footer>workshop.liberte.host</footer>
      </main>
    </body>
    </html>
