apiVersion: apps/v1
kind: Deployment
metadata:
  name: workshop-home
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: workshop-home
  template:
    metadata:
      labels:
        app.kubernetes.io/name: workshop-home
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
      containers:
        - name: home
          image: ghcr.io/nginx/nginx-unprivileged:stable-alpine@sha256:ea4fd7ab5a8dc6348c18240bd3546f355f8373cd8f112580f7d8bd8ff5a74772
          command: [nginx]
          args: [-c, /srv/workshop/nginx.conf, -g, "daemon off;"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: page
              mountPath: /srv/workshop
              readOnly: true
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: page
          configMap:
            name: workshop-home
        - name: temporary
          emptyDir:
            sizeLimit: 8Mi
---
apiVersion: v1
kind: Service
metadata:
  name: workshop-home
spec:
  selector:
    app.kubernetes.io/name: workshop-home
  ports:
    - name: http
      port: 80
      targetPort: http
