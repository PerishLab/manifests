apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    service:
      spec:
        ipFamilyPolicy: RequireDualStack
        ipFamilies:
          - IPv4
          - IPv6
    tlsStore:
      default:
        defaultCertificate:
          secretName: workshop-wildcard-tls
