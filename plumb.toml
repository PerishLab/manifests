[layout]

[[layout.seat]]
path = "clusters"
note = "Kubernetes manifests, one subtree per cluster; the cluster is the first axis because a sealing key is cluster-specific."

[[layout.seat]]
path = ".plumb"
note = "Plumb-owned affirmation records."

[[layout.file]]
name = ["AGENTS.md"]
rule = ["rule://seat/affirmed"]
note = "The repository entrypoint is affirmed against its governed faces."

[[layout.file]]
name = ["LICENSE"]
note = "Repository licensing."

[[layout.file]]
name = ["plumb.toml", ".gitignore"]
note = "Governance declarations."

[[layout.seat]]
path = "clusters/workshop/locus"
scan = ["clusters/workshop/locus/**/*.py"]
note = "Isolated Locus pilot deployment and measurements."

[runseal.env.vars]
MANIFESTS_LOCAL_DIR = "local://"
MANIFESTS_VALUES_DIR = "local://secrets"
